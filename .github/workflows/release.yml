name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install rclone
        run: brew install rclone
      - name: Build frontend
        working-directory: desktop
        run: |
          npm ci
          npm run build
      - name: Build Tauri (macOS)
        working-directory: desktop
        run: |
          npm install -g @tauri-apps/cli
          npx tauri build --target aarch64-apple-darwin
          npx tauri build --target x86_64-apple-darwin
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: desktop/src-tauri/target/*/release/bundle/dmg/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install rclone
        run: |
          Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile rclone.zip
          Expand-Archive rclone.zip -DestinationPath .
          Copy-Item rclone-*/rclone.exe C:\Windows\System32\
      - name: Build frontend
        working-directory: desktop
        run: |
          npm ci
          npm run build
      - name: Build Tauri (Windows)
        working-directory: desktop
        run: |
          npm install -g @tauri-apps/cli
          npx tauri build --target x86_64-pc-windows-msvc
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: desktop/src-tauri/target/*/release/bundle/msi/*.msi

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rclone
      - name: Build frontend
        working-directory: desktop
        run: |
          npm ci
          npm run build
      - name: Build Tauri (Linux)
        working-directory: desktop
        run: |
          npm install -g @tauri-apps/cli
          npx tauri build --target x86_64-unknown-linux-gnu
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            desktop/src-tauri/target/*/release/bundle/deb/*.deb
            desktop/src-tauri/target/*/release/bundle/appimage/*.AppImage

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            macos-builds/**/*
            windows-builds/**/*
            linux-builds/**/*
          draft: true
          generate_release_notes: true
