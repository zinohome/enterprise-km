server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/enterprise-km.crt;
    ssl_certificate_key /etc/nginx/ssl/enterprise-km.key;

    # Enterprise KM Server (auth, users, teams, search, sync, etc.)
    location /api/ {
        proxy_pass http://127.0.0.1:5056;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Enterprise Knowledge Base — Open Notebook (read-only, JWT-protected)
    location /enterprise/ {
        auth_request /api/auth/verify;
        auth_request_set $auth_user $upstream_http_x_user_id;

        rewrite ^/enterprise/(.*) /$1 break;
        proxy_pass http://127.0.0.1:5058;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-User-ID $auth_user;
    }

    # Personal Open Notebook (direct, no auth — local only)
    # Not proxied — runs on employee's machine at localhost:5055

    # Classifier
    location /classifier/ {
        rewrite ^/classifier/(.*) /$1 break;
        proxy_pass http://127.0.0.1:5057;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
