services:
  # ─── 存储层 ───
  minio:
    image: minio/minio:latest
    container_name: enterprise-km-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── 数据库 ───
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: enterprise-km-surrealdb
    ports:
      - "8000:8000"
    command: start --log trace --user root --pass root file:/data/surrealdb.db
    volumes:
      - surrealdb_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── 任务队列 ───
  redis:
    image: redis:7-alpine
    container_name: enterprise-km-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── 全文搜索 ───
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: enterprise-km-meilisearch
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-enterprise-km-master-key}
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── 向量搜索 ───
  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise-km-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  minio_data:
  surrealdb_data:
  redis_data:
  meilisearch_data:
  qdrant_data:
